services:
  - type: web
    name: vettly-auth-service
    runtime: image
    image:
      url: ghcr.io/vettly/vettly-auth-service:latest
      creds: ghcr
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__SecretKey
        sync: false
      - key: Jwt__Issuer
        value: vettly-auth-service
      - key: Jwt__Audience
        value: vettly-platform
      - key: Jwt__AccessTokenExpirationMinutes
        value: "15"
      - key: Jwt__RefreshTokenExpirationDays
        value: "1"
      - key: Redis__ConnectionString
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: OAuth__Google__ClientId
        sync: false
      - key: OAuth__Google__ClientSecret
        sync: false
      - key: OAuth__GitHub__ClientId
        sync: false
      - key: OAuth__GitHub__ClientSecret
        sync: false
      - key: Frontend__BaseUrl
        sync: false

