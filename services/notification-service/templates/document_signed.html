{{define "content"}}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin-bottom:20px;">
  <tr>
    <td style="width:44px;height:44px;border-radius:12px;background:rgba(91,200,212,.14);text-align:center;vertical-align:middle;font-size:20px;">✅</td>
    <td style="width:12px;">&nbsp;</td>
    <td>
      <p style="margin:0;color:#5BC8D4;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;">Offer Accepted</p>
    </td>
  </tr>
</table>

<p style="margin:0 0 16px;color:#EAECEF;font-size:18px;font-weight:600;line-height:1.4;">{{.CandidateName}} accepted the offer</p>

<p style="margin:0 0 24px;">
  <strong style="color:#EAECEF;">{{.CandidateName}}</strong> signed the offer letter for
  <strong style="color:#EAECEF;">{{.JobTitle}}</strong>. Log in to Vettly to view the signed document.
</p>

<table role="presentation" cellpadding="0" cellspacing="0">
  <tr>
    <td style="border-radius:10px;background:#5BC8D4;">
      <a href="{{.ActionURL}}" style="display:inline-block;padding:12px 24px;color:#0C0D10;font-size:14px;font-weight:600;text-decoration:none;">View candidate →</a>
    </td>
  </tr>
</table>
{{end}}
