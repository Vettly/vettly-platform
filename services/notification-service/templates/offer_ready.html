{{define "content"}}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin-bottom:20px;">
  <tr>
    <td style="width:44px;height:44px;border-radius:12px;background:rgba(91,200,212,.14);text-align:center;vertical-align:middle;font-size:20px;">✍️</td>
    <td style="width:12px;">&nbsp;</td>
    <td>
      <p style="margin:0;color:#5BC8D4;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;">Offer Ready</p>
    </td>
  </tr>
</table>

<p style="margin:0 0 16px;color:#EAECEF;font-size:18px;font-weight:600;line-height:1.4;">Congratulations — you have an offer!</p>

<p style="margin:0 0 24px;">
  Your offer letter for <strong style="color:#EAECEF;">{{.JobTitle}}</strong> is ready to review and sign.
  Log in to Vettly to view the details and accept your offer.
</p>

<table role="presentation" cellpadding="0" cellspacing="0">
  <tr>
    <td style="border-radius:10px;background:#5BC8D4;">
      <a href="{{.ActionURL}}" style="display:inline-block;padding:12px 24px;color:#0C0D10;font-size:14px;font-weight:600;text-decoration:none;">Review your offer →</a>
    </td>
  </tr>
</table>
{{end}}
