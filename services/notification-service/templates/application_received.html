{{define "content"}}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin-bottom:20px;">
  <tr>
    <td style="width:44px;height:44px;border-radius:12px;background:rgba(244,163,64,.14);text-align:center;vertical-align:middle;font-size:20px;">👤</td>
    <td style="width:12px;">&nbsp;</td>
    <td>
      <p style="margin:0;color:#F4A340;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;">New Application</p>
    </td>
  </tr>
</table>

<p style="margin:0 0 16px;color:#EAECEF;font-size:18px;font-weight:600;line-height:1.4;">You have a new applicant</p>

<p style="margin:0 0 24px;">
  <strong style="color:#EAECEF;">{{.CandidateName}}</strong> just applied for
  <strong style="color:#EAECEF;">{{.JobTitle}}</strong>. Review their profile, resume, and AI screening score in your pipeline.
</p>

<table role="presentation" cellpadding="0" cellspacing="0">
  <tr>
    <td style="border-radius:10px;background:#F4A340;">
      <a href="{{.ActionURL}}" style="display:inline-block;padding:12px 24px;color:#0C0D10;font-size:14px;font-weight:600;text-decoration:none;">View application →</a>
    </td>
  </tr>
</table>
{{end}}
