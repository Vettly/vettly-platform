name: Build & Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: vettly

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth-service: ${{ steps.filter.outputs.auth-service }}
      candidate-service: ${{ steps.filter.outputs.candidate-service }}
      job-service: ${{ steps.filter.outputs.job-service }}
      organization-service: ${{ steps.filter.outputs.organization-service }}
      messaging-service: ${{ steps.filter.outputs.messaging-service }}
      esign-service: ${{ steps.filter.outputs.esign-service }}
      interview-service: ${{ steps.filter.outputs.interview-service }}
      screening-service: ${{ steps.filter.outputs.screening-service }}
      matching-service: ${{ steps.filter.outputs.matching-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service:
              - 'services/auth-service/**'
              - 'services/shared/**'
            candidate-service:
              - 'services/candidate-service/**'
              - 'services/shared/**'
            job-service:
              - 'services/job-service/**'
              - 'services/shared/**'
            organization-service:
              - 'services/organization-service/**'
              - 'services/shared/**'
            messaging-service:
              - 'services/messaging-service/**'
              - 'services/shared/**'
            esign-service:
              - 'services/esign-service/**'
              - 'services/shared/**'
            interview-service:
              - 'services/interview-service/**'
              - 'services/shared/**'
            screening-service:
              - 'services/screening-service/**'
            matching-service:
              - 'services/matching-service/**'
            notification-service:
              - 'services/notification-service/**'
            api-gateway:
              - 'services/api-gateway/**'

  build-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: auth-service
            context: ./services
            dockerfile: ./services/auth-service/Dockerfile
            deployHookSecret: RENDER_DEPLOY_HOOK_AUTH_SERVICE
          - name: candidate-service
            context: ./services
            dockerfile: ./services/candidate-service/Dockerfile
            deployHookSecret: RENDER_DEPLOY_HOOK_CANDIDATE_SERVICE
          - name: job-service
            context: ./services
            dockerfile: ./services/job-service/Dockerfile
            deployHookSecret: RENDER_DEPLOY_HOOK_JOB_SERVICE
          - name: organization-service
            context: ./services
            dockerfile: ./services/organization-service/Dockerfile
            deployHookSecret: RENDER_DEPLOY_HOOK_ORGANIZATION_SERVICE
          - name: messaging-service
            context: ./services
            dockerfile: ./services/messaging-service/Dockerfile
            deployHookSecret: RENDER_DEPLOY_HOOK_MESSAGING_SERVICE
          - name: esign-service
            context: ./services
            dockerfile: ./services/esign-service/Dockerfile
            deployHookSecret: RENDER_DEPLOY_HOOK_ESIGN_SERVICE
          - name: interview-service
            context: ./services
            dockerfile: ./services/interview-service/Dockerfile
            deployHookSecret: RENDER_DEPLOY_HOOK_INTERVIEW_SERVICE
          - name: screening-service
            context: ./services
            dockerfile: ./services/screening-service/Dockerfile
            deployHookSecret: RENDER_DEPLOY_HOOK_SCREENING_SERVICE
          - name: matching-service
            context: ./services
            dockerfile: ./services/matching-service/Dockerfile
            deployHookSecret: RENDER_DEPLOY_HOOK_MATCHING_SERVICE
          - name: notification-service
            context: ./services/notification-service
            dockerfile: ./services/notification-service/Dockerfile
            deployHookSecret: RENDER_DEPLOY_HOOK_NOTIFICATION_SERVICE
          - name: api-gateway
            context: ./services/api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
            deployHookSecret: RENDER_DEPLOY_HOOK_API_GATEWAY
    steps:
      - name: Check whether this service changed
        id: should-build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ needs.detect-changes.outputs[matrix.name] }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.should-build.outputs.run == 'true'

      - name: Log in to GHCR
        if: steps.should-build.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.should-build.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        if: steps.should-build.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/vettly-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/vettly-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trigger Render deploy for ${{ matrix.name }}
        if: steps.should-build.outputs.run == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets[matrix.deployHookSecret] }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "No deploy hook configured for ${{ matrix.name }} (secret ${{ matrix.deployHookSecret }} not set), skipping"
            exit 0
          fi
          curl -fsSL -X POST "$DEPLOY_HOOK_URL"
