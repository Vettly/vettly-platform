name: Build & Push Images

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: vettly

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: auth-service
            context: ./services
            dockerfile: ./services/auth-service/Dockerfile
          - name: candidate-service
            context: ./services
            dockerfile: ./services/candidate-service/Dockerfile
          - name: job-service
            context: ./services
            dockerfile: ./services/job-service/Dockerfile
          - name: organization-service
            context: ./services
            dockerfile: ./services/organization-service/Dockerfile
          - name: messaging-service
            context: ./services
            dockerfile: ./services/messaging-service/Dockerfile
          - name: esign-service
            context: ./services
            dockerfile: ./services/esign-service/Dockerfile
          - name: interview-service
            context: ./services
            dockerfile: ./services/interview-service/Dockerfile
          - name: screening-service
            context: ./services
            dockerfile: ./services/screening-service/Dockerfile
          - name: matching-service
            context: ./services
            dockerfile: ./services/matching-service/Dockerfile
          - name: notification-service
            context: ./services/notification-service
            dockerfile: ./services/notification-service/Dockerfile
          - name: api-gateway
            context: ./services/api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/vettly-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/vettly-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    if: ${{ vars.COOLIFY_WEBHOOK_URL != '' || secrets.COOLIFY_WEBHOOK_URL != '' }}
    steps:
      - name: Trigger Coolify redeploy
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl -fsSL -X POST "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN"
